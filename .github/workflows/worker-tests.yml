name: worker-tests
on:
  push:
    paths: ['cloudflare/**', '.github/workflows/worker-tests.yml']
  pull_request:
    paths: ['cloudflare/**', '.github/workflows/worker-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cloudflare/ministry-tracker-push/test/feed.test.mjs
