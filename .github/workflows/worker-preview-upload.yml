# PREVIEW UPLOAD ONLY - ministry-tracker-push
#
# SAFETY: this file is the only thing that keeps the Cloudflare token from
# deploying to production. It must never contain `wrangler deploy`,
# `wrangler versions deploy`, or `wrangler triggers deploy`.
# Do not edit this file without David's explicit approval in chat.
# The token lives in the `cloudflare-preview` environment, so every upload
# run waits for David's Approve tap before it can read the secrets.
# Decision record: .ai/ACTIVE_TASK.md, section "2026-10-09 - Worker preview upload pilot".

name: worker-preview-upload

on:
  push:
    branches: [main]
    paths: ['cloudflare/ministry-tracker-push/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-preview-upload
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cloudflare/ministry-tracker-push/test/*.test.mjs

  upload:
    needs: test
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upload a new version (no traffic, no deploy)
        working-directory: cloudflare/ministry-tracker-push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # Strip stray whitespace/newlines from pasted secrets (mobile paste bug, 2026-10-09).
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx --yes wrangler@4.149.0 versions upload --message "preview ${GITHUB_SHA::7}" 2>&1 | tee upload.log
      - name: Summary
        if: always()
        working-directory: cloudflare/ministry-tracker-push
        run: |
          {
            echo "### ministry-tracker-push preview upload"
            echo "Commit: ${GITHUB_SHA}"
            echo "Uploaded as a version only. Nothing was deployed. The live Worker is unchanged."
            grep -i "version id" upload.log || echo "No version ID found in the upload log."
          } >> "$GITHUB_STEP_SUMMARY"
