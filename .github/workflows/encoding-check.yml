name: encoding-check

# Fails the build on broken UTF-8 or invalid JavaScript in the app shell modules.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check for mojibake / broken encoding
        run: node scripts/check-encoding.mjs .
      - name: Check JavaScript syntax
        run: |
          node --check js/organizer.js
          node --check js/push-config.js
          node --check sw.js
